<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WoofBot Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #f5f5f5;
            margin: 0;
        }
        h1 { font-size: 24px; color: #333; }
        p { font-size: 16px; color: #666; margin: 5px 0; }
        #status { margin-top: 10px; font-size: 16px; color: #ff4d4f; }
        #info { margin-top: 20px; text-align: left; max-width: 90%; margin-left: auto; margin-right: auto; }
        #info h2 { font-size: 20px; color: #333; }
    </style>
</head>
<body>
    <h1>WoofBot Test</h1>
    <p>Telegram Mini App Test</p>
    <div id="status">Loading...</div>
    <div id="info">
        <h2>User Info</h2>
        <p>Username: <span id="userName">Loading...</span></p>
        <p>User ID: <span id="userId">Loading...</span></p>
        <p>First Name: <span id="firstName">Loading...</span></p>
        <p>Last Name: <span id="lastName">Loading...</span></p>
        <p>Language: <span id="languageCode">Loading...</span></p>
        <p>Premium: <span id="isPremium">Loading...</span></p>
        <p>initData: <span id="initData">Loading...</span></p>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const status = document.getElementById('status');
        if (!window.Telegram || !window.Telegram.WebApp) {
            status.innerText = "Error: Please open in Telegram";
            return;
        }

        const Telegram = window.Telegram.WebApp;
        Telegram.ready();

        const user = Telegram.initDataUnsafe?.user;
        if (!user || !user.id) {
            status.innerText = "Error: No user data available";
            return;
        }

        document.getElementById('userId').innerText = user.id;
        document.getElementById('userName').innerText = user.username ? `@${user.username}` : "Not set";
        document.getElementById('firstName').innerText = user.first_name || "Not set";
        document.getElementById('lastName').innerText = user.last_name || "Not set";
        document.getElementById('languageCode').innerText = user.language_code || "Unknown";
        document.getElementById('isPremium').innerText = user.is_premium ? "Yes" : "No";
        document.getElementById('initData').innerText = Telegram.initData || "No data";

        status.innerText = "Success!";
        status.style.color = "#28a745";
    </script>
</body>
</html>
