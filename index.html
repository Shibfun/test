<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WoofBot Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h1 { color: #333; }
        p { color: #666; margin: 5px 0; }
        #status { margin: 10px 0; font-size: 18px; }
        #info { max-width: 90%; margin: 20px auto; text-align: left; }
        .success { color: #28a745; }
        .error { color: #ff4d4f; }
    </style>
</head>
<body>
    <h1>WoofBot Test</h1>
    <p>Telegram Mini App Test</p>
    <div id="status">Loading...</div>
    <div id="info">
        <h2>User Info</h2>
        <p>Username: <span id="userName">Loading...</span></p>
        <p>User ID: <span id="userId">Loading...</span></p>
        <p>First Name: <span id="firstName">Loading...</span></p>
        <p>Last Name: <span id="lastName">Loading...</span></p>
        <p>Language: <span id="languageCode">Loading...</span></p>
        <p>Premium: <span id="isPremium">Loading...</span></p>
        <p>initData: <span id="initData">Loading...</span></p>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const status = document.getElementById('status');
        const updateInfo = (key, value) => {
            document.getElementById(key).innerText = value;
        };

        try {
            if (!window.Telegram || !window.Telegram.WebApp) {
                throw new Error("Telegram Web App not found. Please open in Telegram.");
            }

            const Telegram = window.Telegram.WebApp;
            Telegram.ready();

            const initData = Telegram.initData || "No initData";
            updateInfo("initData", initData);

            const user = Telegram.initDataUnsafe?.user;
            if (!user || !user.id) {
                throw new Error("No user data available.");
            }

            updateInfo("userId", user.id);
            updateInfo("userName", user.username ? `@${user.username}` : "Not set");
            updateInfo("firstName", user.first_name || "Not set");
            updateInfo("lastName", user.last_name || "Not set");
            updateInfo("languageCode", user.language_code || "Unknown");
            updateInfo("isPremium", user.is_premium ? "Yes" : "No");

            status.innerText = "Success!";
            status.className = "success";
        } catch (error) {
            status.innerText = `Error: ${error.message}`;
            status.className = "error";
        }
    </script>
</body>
</html>
